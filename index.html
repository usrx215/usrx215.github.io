<script>

<script>
const leftPupil   = document.getElementById('leftPupil');
const rightPupil  = document.getElementById('rightPupil');
const tongueGroup = document.getElementById('tongue-group');
const leftEyeCenter  = { x: 75,  y: 80 };
const rightEyeCenter = { x: 125, y: 95 };
const eyeRadius = 3;

let isAnimating = false, lickTimer = null, currentTongueX = 0, rafId = null;

function setTongueX(x) {
  currentTongueX = x;
  tongueGroup.setAttribute('transform', `translate(${x}, 0)`);
}
function easeInQuad(t)  { return t * t; }
function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

function animateTongue(from, to, duration, easingFn, onDone) {
  if (rafId) cancelAnimationFrame(rafId);
  const start = performance.now();
  function step(now) {
    const t = Math.min((now - start) / duration, 1);
    setTongueX(from + (to - from) * easingFn(t));
    if (t < 1) { rafId = requestAnimationFrame(step); }
    else { rafId = null; if (onDone) onDone(); }
  }
  rafId = requestAnimationFrame(step);
}

function triggerLick() {
  isAnimating = true;
  leftPupil.setAttribute('cx',  leftEyeCenter.x);
  leftPupil.setAttribute('cy',  leftEyeCenter.y);
  rightPupil.setAttribute('cx', rightEyeCenter.x);
  rightPupil.setAttribute('cy', rightEyeCenter.y);
  animateTongue(0, -60, 300, easeInQuad, () => {
    animateTongue(-60, 0, 2000, easeOutCubic, () => {
      isAnimating = false;
      scheduleLick();
    });
  });
}

function scheduleLick() {
  if (lickTimer) clearTimeout(lickTimer);
  const delay = 120_000 + Math.random() * 10_000;
  lickTimer = setTimeout(triggerLick, delay);
}
scheduleLick();

document.addEventListener('mousemove', e => {
  if (isAnimating) return;
  const rect = document.querySelector('.hex-container svg').getBoundingClientRect();
  const svgW = rect.width, svgH = rect.height;
  const vbW = 190, vbH = 221.72, vbX = 5, vbY = 4.14;
  const mouseX = (e.clientX - rect.left)  * (vbW / svgW) + vbX;
  const mouseY = (e.clientY - rect.top)   * (vbH / svgH) + vbY;
  function movePupil(el, center) {
    const dx = mouseX - center.x, dy = mouseY - center.y;
    const angle = Math.atan2(dy, dx);
    el.setAttribute('cx', center.x + Math.cos(angle) * eyeRadius);
    el.setAttribute('cy', center.y + Math.sin(angle) * eyeRadius);
  }
  movePupil(leftPupil,  leftEyeCenter);
  movePupil(rightPupil, rightEyeCenter);
});
</script>

<script>

const KONAMI = [
  'ArrowUp','ArrowUp','ArrowDown','ArrowDown',
  'ArrowLeft','ArrowRight','ArrowLeft','ArrowRight',
  'b','a'
];
let konamiIdx = 0;

document.addEventListener('keydown', e => {
  const expected = KONAMI[konamiIdx];
  if (e.key === expected) {
    konamiIdx++;
    if (konamiIdx === KONAMI.length) {
      konamiIdx = 0;
      launchPong();
    }
  } else {
    // allow re-try from start (or position 1 if first key matches restart)
    konamiIdx = (e.key === KONAMI[0]) ? 1 : 0;
  }
});

const overlay   = document.getElementById('pong-overlay');
const canvas    = document.getElementById('pong-canvas');
const scoreEl   = document.getElementById('pong-score');
const winMsg    = document.getElementById('pong-win-msg');
const winText   = document.getElementById('pong-win-text');
const winSub    = document.getElementById('pong-win-sub');
const ctx       = canvas.getContext('2d');

const W = canvas.width, H = canvas.height;
const PADDLE_W = 12, PADDLE_H = 80, BALL_R = 8;
const PADDLE_SPEED = 4;
const AI_SPEED = 3.2;
const WIN_SCORE = 11;
const TEAL = '#20b2aa', GREEN = '#32cd32';

let pongActive = false, animFrame = null;
let scoreL = 0, scoreR = 0;
let ball, paddleL, paddleR, keys;

function resetBall(dir = 1) {
  const angle = (Math.random() * 60 - 30) * (Math.PI / 180);
  const speed = 3.5 + Math.min(scoreL + scoreR, 8) * 0.15;
  ball = {
    x: W / 2, y: H / 2,
    vx: Math.cos(angle) * speed * dir,
    vy: Math.sin(angle) * speed,
    r: BALL_R
  };
}

function initPong() {
  scoreL = 0; scoreR = 0;
  keys = {};
  paddleL = { x: 20,       y: H/2 - PADDLE_H/2, w: PADDLE_W, h: PADDLE_H };
  paddleR = { x: W-20-PADDLE_W, y: H/2 - PADDLE_H/2, w: PADDLE_W, h: PADDLE_H };
  resetBall(1);
  updateScoreDisplay();
}

function updateScoreDisplay() {
  scoreEl.textContent = `${scoreL}   ${scoreR}`;
}

function drawRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 3);
  ctx.fill();
}

function drawBall() {
  ctx.fillStyle = '#ffffff';
  ctx.shadowBlur = 14;
  ctx.shadowColor = GREEN;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawNet() {
  ctx.setLineDash([10, 14]);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();
  ctx.setLineDash([]);
}

function pongLoop() {
  if (!pongActive) return;

  if (keys['w'] || keys['W'])          paddleL.y = Math.max(0, paddleL.y - PADDLE_SPEED);
  if (keys['s'] || keys['S'])          paddleL.y = Math.min(H - PADDLE_H, paddleL.y + PADDLE_SPEED);

  const aiCenter = paddleR.y + PADDLE_H / 2;
  const deadzone = 10;
  if (ball.y < aiCenter - deadzone)      paddleR.y = Math.max(0,            paddleR.y - AI_SPEED);
  else if (ball.y > aiCenter + deadzone) paddleR.y = Math.min(H - PADDLE_H, paddleR.y + AI_SPEED);

  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.y - ball.r <= 0)  { ball.y = ball.r;      ball.vy *= -1; }
  if (ball.y + ball.r >= H)  { ball.y = H - ball.r;  ball.vy *= -1; }

  function hitPaddle(p) {
    return ball.x - ball.r < p.x + p.w &&
           ball.x + ball.r > p.x &&
           ball.y > p.y && ball.y < p.y + p.h;
  }

  if (hitPaddle(paddleL) && ball.vx < 0) {
    const rel = ((ball.y - (paddleL.y + PADDLE_H / 2)) / (PADDLE_H / 2));
    const angle = rel * (Math.PI / 3.5);
    const speed = Math.hypot(ball.vx, ball.vy) * 1.04;
    ball.vx =  Math.cos(angle) * speed;
    ball.vy =  Math.sin(angle) * speed;
    ball.x = paddleL.x + PADDLE_W + ball.r;
  }
  if (hitPaddle(paddleR) && ball.vx > 0) {
    const rel = ((ball.y - (paddleR.y + PADDLE_H / 2)) / (PADDLE_H / 2));
    const angle = rel * (Math.PI / 3.5);
    const speed = Math.hypot(ball.vx, ball.vy) * 1.04;
    ball.vx = -Math.cos(angle) * speed;
    ball.vy =  Math.sin(angle) * speed;
    ball.x = paddleR.x - ball.r;
  }

  let scored = false;
  if (ball.x < 0)  { scoreR++; scored = true; resetBall(-1); }
  if (ball.x > W)  { scoreL++; scored = true; resetBall( 1); }
  if (scored) updateScoreDisplay();
 
  ctx.clearRect(0, 0, W, H);
  drawNet();
  drawRect(paddleL.x, paddleL.y, paddleL.w, paddleL.h, TEAL);
  drawRect(paddleR.x, paddleR.y, paddleR.w, paddleR.h, GREEN);
  drawBall();

  if (scoreL >= WIN_SCORE || scoreR >= WIN_SCORE) {
    endPong(scoreL >= WIN_SCORE ? 'YOU WIN!' : 'AI WINS');
    return;
  }

  animFrame = requestAnimationFrame(pongLoop);
}

function endPong(winner) {
  pongActive = false;
  cancelAnimationFrame(animFrame);

  winText.textContent = winner;
  winMsg.classList.add('show');

  let secs = 3;
  const countdown = setInterval(() => {
    secs--;
    if (secs <= 0) {
      clearInterval(countdown);
      closePong();
    } else {
      winSub.textContent = `closing in ${secs}…`;
    }
  }, 1000);
}

function closePong() {
  overlay.classList.remove('active');
  winMsg.classList.remove('show');
  cancelAnimationFrame(animFrame);
  document.removeEventListener('keydown', pongKeyDown);
  document.removeEventListener('keyup',   pongKeyUp);
}

function pongKeyDown(e) {
  keys[e.key] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
    e.preventDefault();
  }
}
function pongKeyUp(e) { keys[e.key] = false; }

function launchPong() {
  if (pongActive) return;
  initPong();
  pongActive = true;
  overlay.classList.add('active');
  winMsg.classList.remove('show');
  document.addEventListener('keydown', pongKeyDown);
  document.addEventListener('keyup',   pongKeyUp);
  animFrame = requestAnimationFrame(pongLoop);
}
</script>
